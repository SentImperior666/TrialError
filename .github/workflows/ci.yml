name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # TrialError is Windows-first (developed and verified on Windows 11);
    # a Linux lane can join once it has actually been proven there.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Test
        run: python -m pytest tests -q
