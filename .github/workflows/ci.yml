name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # TrialError was developed Windows-first; the Linux lane joined once the
    # suite had actually been proven there (see docs/GETTING_STARTED.md).
    # Both are required now -- neither platform is allowed to rot.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Quoted: unquoted bracket extras are a glob, which works in bash by
        # accident (no match -> passed through literally) but errors under
        # zsh and under `set -f`.
        run: pip install -e '.[dev]'
      - name: Test
        run: python -m pytest tests -q
